<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#fff8e7">

    <meta
        name="description"
        content="Kisah Arnab dan Kura-Kura, sebuah buku cerita digital interaktif dengan audio dan ilustrasi untuk kanak-kanak."
    >

    <title>Kisah Arnab dan Kura-Kura | Buku Cerita Digital</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ====================================== -->
    <!-- MUKA DEPAN BUKU                        -->
    <!-- ====================================== -->

    <section
        id="cover"
        class="cover"
        aria-label="Muka depan buku Kisah Arnab dan Kura-Kura"
    >

        <!-- GAMBAR MUKA DEPAN -->

        <img
            id="gambar-cover"
            src="images/coversatu.png"
            alt="Arnab dan Kura-Kura di dalam hutan"
            fetchpriority="high"
        >

        <!-- KANDUNGAN MUKA DEPAN -->

        <div class="cover-content">

            <h1>KISAH ARNAB DAN KURA-KURA</h1>

            <p>Buku Cerita Digital Interaktif</p>

            <button
                id="btn-mula"
                type="button"
                aria-label="Mula membaca Kisah Arnab dan Kura-Kura"
            >
                Mula Membaca 📖
            </button>

        </div>

    </section>


    <!-- ====================================== -->
    <!-- HALAMAN CERITA                         -->
    <!-- ====================================== -->

    <main id="halaman-cerita" hidden>

        <!-- NOMBOR HALAMAN -->

        <p
            id="nombor-halaman"
            aria-live="polite"
            aria-atomic="true"
        ></p>


        <!-- TEKS CERITA -->

        <div
            id="teks-cerita"
            aria-label="Teks cerita"
        ></div>


        <!-- GAMBAR CERITA -->

        <img
            id="gambar-cerita"
            src=""
            alt="Ilustrasi cerita Arnab dan Kura-Kura"
            loading="eager"
        >


        <!-- ================================== -->
        <!-- KAWALAN AUDIO                      -->
        <!-- ================================== -->

        <div class="kawalan-audio">

            <button
                id="btn-baca-semula"
                type="button"
                aria-label="Baca semula audio halaman ini"
            >
                🔁 Baca Semula Ayat
            </button>

        </div>


        <!-- ================================== -->
        <!-- NAVIGASI HALAMAN                   -->
        <!-- ================================== -->

        <nav
            class="butang-navigasi"
            aria-label="Navigasi buku cerita"
        >

            <!-- HALAMAN SEBELUMNYA -->

            <button
                id="btn-sebelum"
                type="button"
                aria-label="Halaman sebelumnya"
                title="Halaman sebelumnya"
            >
                ❮
            </button>


            <!-- HALAMAN SETERUSNYA -->

            <button
                id="btn-seterusnya"
                type="button"
                aria-label="Halaman seterusnya"
                title="Halaman seterusnya"
            >
                ❯
            </button>

        </nav>

    </main>


    <!-- ====================================== -->
    <!-- PEMAIN AUDIO                          -->
    <!-- ====================================== -->

    <audio
        id="audio-cerita"
        preload="auto"
    ></audio>


    <!-- ====================================== -->
    <!-- JAVASCRIPT                            -->
    <!-- ====================================== -->

    <script src="script.js"></script>


    <!-- ====================================== -->
    <!-- CUBA MAIN AUDIO COVER SECARA AUTOMATIK -->
    <!-- ====================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const cover = document.getElementById("cover");

            const butangMula = document.getElementById("btn-mula");

            let audioCover = new Audio("audio/coversatu.mp3");

            audioCover.preload = "auto";

            audioCover.addEventListener("error", function () {

                console.warn(
                    "Audio cover tidak dapat dimuatkan. Semak fail audio/coversatu.mp3."
                );

            });

            function cubaMainAudioCover() {

                if (!cover || cover.hidden) {
                    return;
                }

                if (!audioCover.paused) {
                    return;
                }

                audioCover.play().catch(function (ralat) {

                    console.warn(
                        "Pelayar menyekat autoplay audio cover. Audio akan dicuba semula selepas interaksi pengguna.",
                        ralat
                    );

                });

            }

            // Cuba memainkan audio apabila halaman selesai dimuatkan.

            cubaMainAudioCover();

            // Cuba semula apabila pengguna berinteraksi dengan halaman.

            document.addEventListener(
                "pointerdown",
                function () {

                    if (
                        cover &&
                        !cover.hidden &&
                        audioCover.paused
                    ) {
                        cubaMainAudioCover();
                    }

                },
                { passive: true }
            );

            // Apabila pengguna mula membaca, hentikan audio cover.

            if (butangMula) {

                butangMula.addEventListener("click", function () {

                    audioCover.pause();

                    audioCover.currentTime = 0;

                });

            }

        });

    </script>

</body>

</html>
